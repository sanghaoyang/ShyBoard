<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShyBoard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶栏 -->
<header id="topbar">
  <div class="tb-left">
    <span id="date-line" class="tb-date"></span>
    <span id="clock" class="tb-clock"></span>
  </div>
  <div class="tb-right">
    <span id="beta-badge" class="tb-beta" style="display:none" title="测试版：不走自动更新，用于新功能尝鲜">Beta</span>
    <button id="btn-update" title="检查更新" class="tb-refresh">⬆</button>
    <button id="btn-refresh" title="刷新数据" class="tb-refresh">↻</button>
    <div id="weather" class="tb-weather" title="点击修改城市">
      <span id="w-icon"></span>
      <span id="w-temp"></span>
      <span id="w-live" class="w-live" title="当前实时温度">实时</span>
      <span id="w-city"></span>
    </div>
  </div>
</header>

<div id="app">
  <!-- 左侧导航（LX Music 风格：窄条图标菜单） -->
  <nav id="sidenav">
    <button class="nav-item active" data-view="tasks" title="任务看板">📋</button>
    <button class="nav-item" data-view="calendar" title="日历">📅</button>
    <button class="nav-item" data-view="settings" title="设置">⚙️</button>
  </nav>

  <!-- 内容区（按左侧菜单切换） -->
  <div id="content">

    <!-- 视图：任务 -->
    <div class="view active" id="view-tasks">
      <div id="layout">
        <!-- 侧栏（任务相关） -->
        <aside id="sidebar">
          <section class="panel" id="stat-panel">
            <h3>任务统计</h3>
            <div id="stats" class="stats-grid"></div>
          </section>

          <section class="panel" id="pomo-panel">
            <h3>番茄钟
              <span class="pomo-count" id="pomo-count" title="今日完成番茄数"></span>
            </h3>
            <div class="pomo-time" id="pomo-time">25:00</div>
            <div class="pomo-phase" id="pomo-phase">就绪 · 点击开始专注</div>
            <div class="pomo-actions">
              <button class="btn primary sm" id="pomo-start">开始</button>
              <button class="btn ghost sm" id="pomo-skip" disabled>跳过</button>
            </div>
          </section>

          <section class="panel" id="link-panel">
            <h3>快捷方式
              <button class="icon-btn add-link-btn" title="添加链接">＋</button>
            </h3>
            <div id="links" class="link-list"></div>
          </section>

          <section class="panel" id="note-panel">
            <h3>便签
              <button class="icon-btn add-note-btn" title="添加便签">＋</button>
            </h3>
            <div id="notes" class="note-list"></div>
          </section>
        </aside>

        <!-- 任务主区 -->
        <main id="main">
          <div id="new-task">
            <input id="nt-title" type="text" placeholder="添加新任务，回车创建…" maxlength="120" autocomplete="off">
            <button id="nt-add" class="btn primary">添加</button>
            <button id="nt-more" class="btn ghost" title="更多选项">⋯</button>
            <div id="nt-detail" class="hidden">
              <select id="nt-priority">
                <option value="high">高优先级</option>
                <option value="medium" selected>中优先级</option>
                <option value="low">低优先级</option>
              </select>
              <input id="nt-due" type="date" autocomplete="off">
              <input id="nt-tags" type="text" placeholder="标签，逗号分隔" autocomplete="off">
              <input id="nt-desc" type="text" placeholder="描述（可选）" autocomplete="off">
            </div>
          </div>

          <div id="lanes">
            <div class="lane" data-status="todo">
              <div class="lane-head">
                <h2>待办</h2>
                <span class="lane-count" id="cnt-todo">0</span>
              </div>
              <div class="lane-body" id="lane-todo"></div>
            </div>
            <div class="lane" data-status="doing">
              <div class="lane-head">
                <h2>进行中</h2>
                <span class="lane-count" id="cnt-doing">0</span>
              </div>
              <div class="lane-body" id="lane-doing"></div>
            </div>
            <div class="lane" data-status="done">
              <div class="lane-head">
                <h2>已完成</h2>
                <span class="lane-count" id="cnt-done">0</span>
              </div>
              <div class="lane-body" id="lane-done"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- 视图：日历（纪念日已集成在日历内） -->
    <div class="view" id="view-calendar">
      <div class="cal-head">
        <button class="btn primary sm" id="cal-today-btn">今天</button>
        <button class="btn ghost sm" id="cal-add-ann-btn">＋ 纪念日</button>
        <div class="cal-spacer"></div>
        <select id="cal-year" class="cal-ym" title="跳转到某年"></select>
        <select id="cal-month" class="cal-ym" title="跳转到某月"></select>
        <button class="cal-nav" id="cal-prev">‹</button>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-anns-bar">
        <div class="cal-anns-title">🎂 纪念日</div>
        <div id="anns" class="ann-list cal-anns-list"></div>
      </div>
    </div>

    <!-- 视图：设置 -->
    <div class="view" id="view-settings">
      <div class="page-head">
        <h2>⚙️ 设置</h2>
      </div>
      <div class="settings-page">
        <div class="set-group">
          <div class="set-row">
            <div class="set-info">
              <div class="set-name">界面主题</div>
              <div class="set-desc">选择喜欢的色系，切换立即生效</div>
            </div>
          </div>
          <div class="theme-picker" id="theme-picker">
            <button class="theme-opt" data-theme="pink" title="灰玫瑰 · 柔和粉">
              <span class="th-swatch"><i style="background:#D0899C"></i><i style="background:#FBF7F8"></i></span>
              <span class="th-name">灰玫瑰</span>
            </button>
            <button class="theme-opt" data-theme="dark" title="暗夜薰衣草 · 深色护眼">
              <span class="th-swatch"><i style="background:#A99BC9"></i><i style="background:#1E1B24"></i></span>
              <span class="th-name">暗夜薰衣草</span>
            </button>
            <button class="theme-opt" data-theme="light" title="晨雾蓝 · 明亮清爽">
              <span class="th-swatch"><i style="background:#6E8FB8"></i><i style="background:#FFFFFF"></i></span>
              <span class="th-name">晨雾蓝</span>
            </button>
            <button class="theme-opt" data-theme="orange" title="暖杏 · 温暖橙调">
              <span class="th-swatch"><i style="background:#E09A52"></i><i style="background:#FFF9F2"></i></span>
              <span class="th-name">暖杏</span>
            </button>
            <button class="theme-opt" data-theme="green" title="鼠尾草 · 清新绿调">
              <span class="th-swatch"><i style="background:#7FA57E"></i><i style="background:#F7FAF6"></i></span>
              <span class="th-name">鼠尾草</span>
            </button>
            <button class="theme-opt" data-theme="teal" title="青碧 · 清新蓝绿">
              <span class="th-swatch"><i style="background:#439BA6"></i><i style="background:#F4FAF8"></i></span>
              <span class="th-name">青碧</span>
            </button>
            <button class="theme-opt" data-theme="terracotta" title="赤陶 · 温暖砖红">
              <span class="th-swatch"><i style="background:#C0715C"></i><i style="background:#FBF5F1"></i></span>
              <span class="th-name">赤陶</span>
            </button>
            <button class="theme-opt" data-theme="navy" title="藏青 · 夜空藏蓝">
              <span class="th-swatch"><i style="background:#7E9FBF"></i><i style="background:#1A2939"></i></span>
              <span class="th-name">藏青</span>
            </button>
            <button class="theme-opt" data-theme="graphite" title="石墨 · 中性极简">
              <span class="th-swatch"><i style="background:#7C7C84"></i><i style="background:#ECECEF"></i></span>
              <span class="th-name">石墨</span>
            </button>
            <button class="theme-opt" data-theme="plum" title="梅子 · 柔紫红调">
              <span class="th-swatch"><i style="background:#9B78AC"></i><i style="background:#FAF7FB"></i></span>
              <span class="th-name">梅子</span>
            </button>
          </div>
          <div class="set-divider"></div>
          <div class="set-row">
            <div class="set-info">
              <div class="set-name">开机自启</div>
              <div class="set-desc">登录 Windows 后自动启动工作台</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-autostart">
              <span class="slider"></span>
            </label>
          </div>
          <div class="set-divider"></div>
          <div class="set-info" style="margin-bottom:6px">
            <div class="set-name">删除前确认</div>
            <div class="set-desc">关闭后删除将直接执行，不再弹确认框</div>
          </div>
          <div class="set-row">
            <div class="set-info">
              <div class="set-name">任务</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-confirm-task">
              <span class="slider"></span>
            </label>
          </div>
          <div class="set-row">
            <div class="set-info">
              <div class="set-name">快捷方式</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-confirm-link">
              <span class="slider"></span>
            </label>
          </div>
          <div class="set-row">
            <div class="set-info">
              <div class="set-name">便签</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-confirm-note">
              <span class="slider"></span>
            </label>
          </div>
          <div class="set-row">
            <div class="set-info">
              <div class="set-name">纪念日</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-confirm-ann">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 弹窗 -->
<div id="modal-mask" class="hidden">
  <div id="modal" class="modal">
    <h3 id="modal-title">标题</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<!-- 删除/危险操作确认弹窗（独立于业务 modal，样式同主题） -->
<div id="confirm-mask" class="hidden">
  <div id="confirm-box" class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <h3 id="confirm-title">确认删除</h3>
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button class="btn ghost" id="confirm-cancel">取消</button>
      <button class="btn danger" id="confirm-ok">删除</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
